name: Build & test wasm kernels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing is compiled on the author's machine: the host is too weak for a wasm
  # toolchain run, so build + numeric tests live here.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Numeric kernel tests
        run: node --test test/*.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: kernels-wasm
          path: target/wasm32-unknown-unknown/release/wasm_pixel_kernels.wasm

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Re-fetch public catalogues and rebuild the inventory
        run: |
          node scripts/fetch-catalogues.mjs
          node scripts/build-inventory.mjs
      - name: Fail if the inventory drops below 200 modules
        run: node -e "const s=require('./inventory/modules.json').summary; if (s.total < 200) { console.error('only '+s.total); process.exit(1) } console.log('modules', s.total)"
