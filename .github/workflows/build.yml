name: Build & test wasm kernels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing is compiled on the author's machine: the host is too weak for a wasm
  # toolchain run, so build + numeric tests live here.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build wasm
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Numeric kernel tests
        run: node --test test/*.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: kernels-wasm
          path: target/wasm32-unknown-unknown/release/wasm_pixel_kernels.wasm

  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Re-fetch public catalogues and rebuild the inventory
        run: |
          node scripts/fetch-catalogues.mjs
          node scripts/build-inventory.mjs
      - name: Fail if the inventory drops below 200 modules
        run: node -e "const s=require('./inventory/modules.json').summary; if (s.total < 200) { console.error('only '+s.total); process.exit(1) } console.log('modules', s.total)"

  # Serve the demo straight from the artifact CI just produced and tested, so the
  # page can never show a build that CI did not verify.
  pages:
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kernels-wasm
      - name: Assemble site
        run: |
          mkdir -p site
          cp wasm_pixel_kernels.wasm site/kernels.wasm
          cp demo/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
